<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Text Change</title>
<style>
body {
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
background-color: rgb(247, 250, 252);
}
h1 {
color: rgb(45, 55, 72);
margin-bottom: 20px;
}
button {
padding: 10px 20px;
font-size: 16px;
color: white;
background-color: rgb(49, 130, 206);
border: none;
border-radius: 5px;
cursor: pointer;
}
button:hover {
background-color: rgb(43, 108, 176);
}
</style>
</head>
<body>
<h1 id="headingText">Hello! Welcome</h1>
<button id="changeBtn">Change Text</button>
<script>
document.getElementById("changeBtn").addEventListener("click", function() {
document.getElementById("headingText").innerText = "Text Changed Successfully!";
});
</script>
</body>
</html>
